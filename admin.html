<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sipariş Sistemi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {font-family:'Poppins', sans-serif; background:#f8f9fa; margin:0; padding:40px;}
    .container {max-width:600px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,.1);}
    h2 {text-align:center; margin-bottom:20px;}
    label {font-weight:600; display:block; margin-top:15px;}
    input, select, textarea {width:100%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:8px;}
    button {margin-top:20px; padding:14px; width:100%; background:#007bff; border:none; color:#fff; font-size:16px; border-radius:8px; cursor:pointer;}
    button:hover {background:#0056b3;}
  </style>
</head>
<body>
  <div class="container">
    <h2>🛒 Admin üçün Sifariş Yarat</h2>

    <label for="name">Ad Soyad</label>
    <input type="text" id="name" placeholder="Müştərinin adını yazın">

    <label for="phone">Telefon</label>
    <input type="text" id="phone" placeholder="+994...">

    <label for="address">Ünvan</label>
    <textarea id="address" rows="3" placeholder="Çatdırılma ünvanı"></textarea>

    <label for="product">Məhsul</label>
    <select id="product">
      <option value="Klassik NFC Kart">Klassik NFC Kart</option>
      <option value="Premium NFC Kart">Premium NFC Kart</option>
      <option value="Metal NFC Kart">Metal NFC Kart</option>
    </select>

    <button onclick="sendOrder()">✅ Sifarişi WhatsApp-a Göndər</button>
  </div>

  <script>
    function sendOrder() {
      let name = document.getElementById('name').value;
      let phone = document.getElementById('phone').value;
      let address = document.getElementById('address').value;
      let product = document.getElementById('product').value;

      let message = `Yeni Sifariş:%0A👤 Ad Soyad: ${name}%0A📞 Telefon: ${phone}%0A🏠 Ünvan: ${address}%0A📦 Məhsul: ${product}`;

      // Buraya öz WhatsApp nömrəni yaz (başında 994 olacaq)
      let whatsapp = `https://wa.me/994555555555?text=${message}`;

      window.open(whatsapp, '_blank');
    }
  </script>
</body>
</html>
